services:
  nginx:
    image: nginx:1.18
    container_name: nginxPV
    ports:
      - "80:80"  # Port hôte : Port conteneur
    volumes:
      - ./src:/var/www/php  # Montage du répertoire src de l'hôte dans /var/www/php du conteneur
      - ./.docker/nginx/conf.d/default.d:/etc/nginx/conf.d/default.conf  # Configuration personnalisée de Nginx
    working_dir: /var/www/php  # Répertoire de travail
    depends_on:
      - php  # Dépend du service php
    networks:
      - mynet
  nginx_ssHash:
    image: nginx:1.18
    container_name: nginxPV_ssHash
    ports:
      - "8181:80"  # Port hôte : Port conteneur
    volumes:
      - ./src_ssHash:/var/www/php  # Montage du répertoire src de l'hôte dans /var/www/php du conteneur
      - ./.docker/nginx/conf.d_ssHash/default.d:/etc/nginx/conf.d/default.conf  # Configuration personnalisée de Nginx
    working_dir: /var/www/php  # Répertoire de travail
    depends_on:
      - php_ssHash  # Dépend du service php
    networks:
      - mynet
  
  nginxiHttpS:
    image: nginx:1.18
    container_name: nginxHTTPSPV
    ports:
      - "443:443"
    volumes:
      - ./src:/var/www/php  # Montage du répertoire src de l'hôte dans /var/www/php du conteneur
      - ./.docker/nginx/conf.dHTTPS/default.d:/etc/nginx/conf.d/default.conf  # Configuration personnalisée de Nginx
      - ./ssl/:/etc/nginx/ssl/ #Dossier pour les certificats	
    working_dir: /var/www/php  # Répertoire de travail
    depends_on:
      - php  # Dépend du service php
    networks:
      - mynet
  


  # Service PHP
  php_ssHash:
    build: ./.docker/php  # Construction de l'image à partir du dockerfile php pour communication avec bdd
    image: phppv-image
    container_name: phpPV_ssHash
    working_dir: /var/www/php  # Répertoire de travail
    volumes:
      - ./src_ssHash:/var/www/php  # Montage du répertoire src de l'hôte dans /var/www/php du conteneur
      
    depends_on:
      - mysql  # Dépend du service MySQL
    networks:
      - mynet

  # Service PHP
  php:
    build: ./.docker/php  # Construction de l'image à partir du dockerfile php pour communication avec bdd
    image: phppv-image
    container_name: phpPV
    working_dir: /var/www/php  # Répertoire de travail
    volumes:
      - ./src:/var/www/php  # Montage du répertoire src de l'hôte dans /var/www/php du conteneur
    depends_on:
      - mysql  # Dépend du service MySQL
    networks:
      - mynet

  # Service MySQL
  mysql:
    image: mysql/mysql-server:8.0
    container_name: mysqlPV
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'  # Autorise la connexion de n'importe quel hôte
    ports:
      - "3306:3306"  # Port hôte : Port conteneur
    volumes:
      - ./mysqldata:/var/lib/mysql  # Connecte le volume mysqldata au répertoire de données de MySQL
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - mynet

  # Service PhpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: phpmyadminPV
    ports:
      - "8080:80"  # Port hôte : Port conteneur
    environment:
      PMA_HOST: mysql  # Hôte de la base de données MySQL
      PMA_PORT: 3306  # Port de la base de données MySQL
    networks:
      - mynet

volumes:
  mysqldata:  # Définition du volume pour les données MySQL
    driver: local

networks:
  mynet:  # Définition du réseau




